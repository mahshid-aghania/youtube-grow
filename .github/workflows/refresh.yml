name: Refresh videos

# Re-discovers popular long-form entertainment and science videos from the
# YouTube Data API and commits the snapshot when the numbers have moved. Pushing
# to main triggers Deploy, so the site follows.
on:
  schedule:
    # 06:15 UTC daily — off the hour, where scheduled runs queue up.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      minViews:
        description: 'Minimum verified views'
        default: '1000000'
        required: false
      minDuration:
        description: 'Minimum duration in seconds'
        default: '480'
        required: false
      pages:
        description: 'Search pages per topic/year query'
        default: '2'
        required: false

permissions:
  contents: write

concurrency:
  group: refresh-videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fails loudly here rather than silently committing a stale snapshot:
      # a scheduled refresh that cannot reach the API is a broken refresh.
      - name: Discover latest videos
        run: >-
          node scripts/fetch-videos.js
          --require-key
          --min-views "${{ inputs.minViews || '1000000' }}"
          --min-duration "${{ inputs.minDuration || '480' }}"
          --pages "${{ inputs.pages || '2' }}"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Validate the new snapshot
        run: npm test

      - name: Commit if the data moved
        run: |
          if git diff --quiet -- data/; then
            echo "No change in data/ — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): refresh video snapshot for $(date -u +%Y-%m-%d)"
          git push
