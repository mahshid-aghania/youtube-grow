      <header class="pagehead">
        <div>
          <p class="pagehead__eyebrow" style="--tone: var(--emerald)">Outperformers</p>
          <h1>Punching above their size</h1>
          <p class="pagehead__sub">
            Videos earning unusually high reach relative to the size of the channel that
            published them.
          </p>
        </div>
        <div class="pagehead__status" id="head-status" aria-live="polite">
          <span class="pill">Loading snapshot…</span>
        </div>
      </header>

      <section class="section" style="padding-top:0" aria-labelledby="table-h">
        <div class="section__head">
          <div>
            <h2 id="table-h">Full breakout ranking</h2>
            <p class="section__desc">
              Sort any column, search by title or channel, and expand to the whole list.
            </p>
          </div>
          <div class="section__tools">
            <label class="sr-only" for="search-breakouts">Search breakout videos by title or channel</label>
            <input class="input section__search" id="search-breakouts" type="search"
                   placeholder="Search title or channel…" autocomplete="off">
          </div>
        </div>
        <div id="table-breakouts">
          <div class="tablecard">
            <div class="skeleton skeleton--row"></div>
            <div class="skeleton skeleton--row"></div>
            <div class="skeleton skeleton--row"></div>
          </div>
        </div>
        <div class="notes" id="notes-breakouts"></div>
      </section>
